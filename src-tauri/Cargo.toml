[package]
name = "nax-notepad"
version = "0.5.2"
description = "Nax-Notepad - fast tabbed text editor with Markdown live preview and large-file support"
authors = ["Naxterra"]
edition = "2021"

[lib]
name = "nax_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
memchr = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
